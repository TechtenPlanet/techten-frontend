name: techten-planet
build_command: npm run build
services:
  - name: backend
    github:
      repo: TechtenPlanet/techten-frontend
      branch: monorepo-setup # Ensure this matches the branch you are deploying
      deploy_on_push: true
    source_dir: backend/ # Specify the subdirectory for the backend
    run_command: npm start
    http_port: 8080
    routes:
      - path: /
      - path: /api
    environment_variables:
      - key: NOTION_API_TOKEN
        scope: RUN_TIME
        value: ${NOTION_API_TOKEN}
      - key: NOTION_BLOG_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_BLOG_DATABASE_ID}
      - key: NOTION_COURSE_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_COURSE_DATABASE_ID}
      - key: NOTION_EVENT_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_EVENT_DATABASE_ID}
      - key: NOTION_CONTACT_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_CONTACT_DATABASE_ID}
      - key: NOTION_ENROLLMENT_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_ENROLLMENT_DATABASE_ID}
      - key: NOTION_EVENT_REGISTRATION_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_EVENT_REGISTRATION_DATABASE_ID}
      - key: NOTION_MENTOR_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_MENTOR_DATABASE_ID}
      - key: NOTION_PARTNERSHIP_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_PARTNERSHIP_DATABASE_ID}
      - key: NOTION_SPONSORSHIP_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_SPONSORSHIP_DATABASE_ID}
      - key: NOTION_VOLUNTEER_DATABASE_ID
        scope: RUN_TIME
        value: ${NOTION_VOLUNTEER_DATABASE_ID}
